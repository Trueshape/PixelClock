<!-- index.html â€” Finestra del display: cornice, canvas LED 64x16, pulsanti impostazioni/chiudi. -->
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>PixelClock</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    .bezel {
      position: absolute; inset: 22px 8px 8px 8px;
      background: #eceae4; border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
      -webkit-app-region: drag;
      display: flex; align-items: center; justify-content: center;
    }
    canvas { background: #050505; border-radius: 6px; }
    /* Pulsante rosso "fisico" sopra la cornice, come la manopola della Pixbar */
    #next {
      position: absolute; top: 8px; left: 40px; width: 34px; height: 18px;
      border: 0; border-radius: 6px 6px 2px 2px; padding: 0; cursor: pointer;
      background: linear-gradient(#ff6a4a, #e0391c);
      box-shadow: inset 0 -3px 0 rgba(0,0,0,.2);
      -webkit-app-region: no-drag;
    }
    #next:active { transform: translateY(2px); box-shadow: none; }
    /* Pulsante blu: cicla una variante del modulo attivo (font, colore, scena) */
    #variant {
      position: absolute; top: 8px; left: 80px; width: 34px; height: 18px;
      border: 0; border-radius: 6px 6px 2px 2px; padding: 0; cursor: pointer;
      background: linear-gradient(#4aa4ff, #1c6fe0);
      box-shadow: inset 0 -3px 0 rgba(0,0,0,.2);
      -webkit-app-region: no-drag;
    }
    #variant:active { transform: translateY(2px); box-shadow: none; }
    .btns {
      position: absolute; top: 26px; right: 14px; display: flex; gap: 6px;
      opacity: 0; transition: opacity .2s; -webkit-app-region: no-drag;
    }
    body:hover .btns { opacity: 1; }
    .btns button {
      width: 18px; height: 18px; border: 0; border-radius: 50%;
      background: #ff5a36; color: #fff; font: bold 11px sans-serif; cursor: pointer; padding: 0;
    }
  </style>
<style>
  /* Versione web: stessa finestra desktop (560x182), centrata nella pagina. */
  html, body { background: #1b1b1b; height: 100%; overflow: auto; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .stage { position: relative; width: 560px; height: 182px; flex: none; }
  .stage .bezel { position: absolute; inset: 22px 8px 8px 8px; }
</style>
<style>
  /* Modal di modifica testo (doppio clic sul display in modalità scorrimento). */
  #editor { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
  #editor.open { display: flex; }
  #editor form { background: #eceae4; color: #1b1b1b; font: 15px system-ui, sans-serif; border-radius: 12px; padding: 22px; width: min(92vw, 420px); display: grid; gap: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  #editor h2 { margin: 0; font-size: 18px; }
  #editor label { display: grid; gap: 6px; font-size: 14px; }
  #editor input[type=text] { font: inherit; padding: 8px 10px; border: 1px solid #b9b5ac; border-radius: 6px; }
  #editor input[type=color] { width: 64px; height: 34px; border: 0; background: none; padding: 0; }
  #editor .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #editor .actions { display: flex; justify-content: flex-end; gap: 10px; }
  #editor button { font: inherit; padding: 9px 16px; border-radius: 8px; border: 1px solid #1b1b1b; background: #1b1b1b; color: #eceae4; cursor: pointer; }
  #editor button.ghost { background: transparent; color: #1b1b1b; }
  #editor button:focus-visible, #editor input:focus-visible { outline: 2px solid #ff5a36; outline-offset: 2px; }</style>
</head>
<body>
  <div class="stage"><div class="bezel"><canvas id="led"></canvas></div>
  <button id="next" title="Modulo successivo"></button>
  <button id="variant" title="Variante (font/colore/scena)"></button>
  <div class="btns">
    <button id="settings" title="Modifica testo (config.json)">âš™</button>
    <button id="close" title="Chiudi">Ã—</button>
  </div>
  <script src="shim.js"></script><script src="font.js"></script>
  <script src="fonts/clockFonts.js"></script>
  <script src="renderer.js"></script>
<div id="editor" role="dialog" aria-modal="true" aria-labelledby="ed-title">
  <form id="ed-form">
    <h2 id="ed-title">Testo scorrevole</h2>
    <label>Testo
      <input type="text" id="ed-text" maxlength="200" required>
    </label>
    <div class="row">
      <label style="display:flex;align-items:center;gap:10px">Colore testo <input type="color" id="ed-color"></label>
      <label style="display:flex;align-items:center;gap:10px">Velocità (LED/s)
        <input type="range" id="ed-speed" min="5" max="60" step="1">
      </label>
    </div>
    <div class="actions">
      <button type="button" class="ghost" id="ed-cancel">Annulla</button>
      <button type="submit">Salva</button>
    </div>
  </form>
</div><script src="editor.js"></script></body>
</html>
